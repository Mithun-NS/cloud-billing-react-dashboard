<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect width="64" height="64" rx="16" fill="#030712" />
  <rect width="62" height="62" x="1" y="1" rx="15" fill="#0f172a" stroke="url(#cloudGrad)" stroke-width="2" />
  
  <!-- Cloud Contour -->
  <path d="M46 36a8 8 0 0 0-7.3-4.8 11.5 11.5 0 0 0-21.4 3.2A8 8 0 0 0 18 50h28a8 8 0 0 0 0-16z" 
        fill="url(#cloudGrad)" opacity="0.25" />
        
  <!-- InfraPulse Activity Waveform -->
  <path d="M14 40h8l4-10 6 18 5-13 4 7 3-2h6" 
        stroke="url(#pulseGrad)" 
        stroke-width="3.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#glow)" />
        
  <!-- Glowing Pulse Indicator Dot -->
  <circle cx="50" cy="40" r="3.5" fill="#22d3ee">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite" />
  </circle>
</svg>